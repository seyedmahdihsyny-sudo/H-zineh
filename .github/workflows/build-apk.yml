name: Build and publish H-zineh APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Install Expo-compatible native dependencies
        run: npx expo install react-native-safe-area-context expo-notifications

      - name: Generate native Android project
        run: npx expo prebuild --platform android --non-interactive

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK for direct download
        run: cp android/app/build/outputs/apk/release/app-release.apk H-zineh.apk

      - name: Publish APK as the latest GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: H-zineh build ${{ github.run_number }}
          body: |
            Automated Android APK build from commit ${{ github.sha }}.
            Download H-zineh.apk below.
          files: H-zineh.apk
          make_latest: true
          fail_on_unmatched_files: true
